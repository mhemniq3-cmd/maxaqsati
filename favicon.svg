<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="16" y="16" width="480" height="480" rx="115" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />
  
  <!-- Subtle Internal Grid Pattern -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-opacity="0.08" stroke-width="2" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#06b6d4" stroke-opacity="0.06" stroke-width="2" />

  <!-- Modern Geometric "M" Monogram for MAX -->
  <path d="M 125 365 V 170 L 256 285 L 387 170 V 365" 
        fill="none" 
        stroke="url(#mGrad)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Central Emerald Diamond Accent -->
  <polygon points="256,230 274,256 256,282 238,256" fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- Top Right Golden Sparkle / Percentage Spark -->
  <g transform="translate(385, 125) scale(0.9)" filter="url(#glow)">
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#f59e0b" />
  </g>
  
  <!-- Bottom Left Emerald Sparkle -->
  <g transform="translate(125, 385) scale(0.6)" filter="url(#glow)">
    <circle cx="0" cy="0" r="14" fill="#10b981" />
  </g>
</svg>